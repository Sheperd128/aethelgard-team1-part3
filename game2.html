<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethelgard Offshore | The Gauntlet</title>
    <link rel="stylesheet" href="global.css">
    <script src="database.js"></script>
    <style>
        .header-panel { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 2rem; }
        .score-display { font-size: 1.5rem; font-weight: bold; color: var(--accent); }
        
        .strike-container { display: flex; gap: 10px; margin-top: 10px; }
        .strike { width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; background: #e2e8f0; border-radius: 4px; font-weight: bold; font-size: 1.2rem; color: #cbd5e1; }
        .strike.active { background: var(--error); color: white; }

        .question-box { font-size: 1.2rem; margin-bottom: 2rem; min-height: 80px; font-weight: bold; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }
        
        .option-btn { background: #f1f5f9; color: var(--text-main); border: 2px solid var(--border-color); padding: 1.2rem; font-size: 1rem; cursor: pointer; border-radius: 4px; transition: 0.2s; text-align: left; font-weight: bold; }
        .option-btn:hover { border-color: var(--accent); background: #e0e7ff; }
        
        .option-btn.correct { background: var(--accent); color: white; border-color: var(--accent); }
        .option-btn.wrong { background: var(--error); color: white; border-color: var(--error); }

        #proceed-btn { display: none; margin-top: 2rem; text-align: center; text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-panel">
            <div>
                <h2>FIREWALL 2: THE GAUNTLET</h2>
                <p style="color: var(--text-muted); font-size: 0.95rem;">Successfully answer 30 authorization queries. <strong style="color: var(--error);">3 errors will result in termination.</strong></p>
                <div class="strike-container" id="strike-box">
                    <div class="strike" id="strike-1">X</div>
                    <div class="strike" id="strike-2">X</div>
                    <div class="strike" id="strike-3">X</div>
                </div>
            </div>
            <div class="score-display">SCORE: <span id="score">0</span> / 30</div>
        </div>

        <div id="game-area">
            <div class="question-box" id="question-text">Loading query...</div>
            <div class="options-grid" id="options-container">
                <!-- Buttons generated by JS -->
            </div>
        </div>
<!-- TEMPORARY DEV SKIP BUTTON (Remove before the actual event) -->
<button onclick="document.getElementById('proceed-btn').style.display='block'; document.getElementById('game-area').style.display='none';" style="background: var(--error); color: white; padding: 10px; margin: 10px auto; display: block; border: none; cursor: pointer; border-radius: 4px; font-weight: bold;">
    DEV SKIP TRIVIA
</button>
        <a id="proceed-btn" class="btn-primary" href="puzzle2.html">FIREWALL BREACHED. PROCEED TO PUZZLE 2.</a>
    </div>

    <script>
        let currentScore = 0;
        let questionsAsked = 0;
        let strikes = 0;
        const TARGET_SCORE = 30;
        const MAX_STRIKES = 3;
        let activeQuestions = [];

        function initGame() {
            // Pulls 30 random questions from database.js
            activeQuestions = getRandom30Questions();
            currentScore = 0;
            questionsAsked = 0;
            strikes = 0;
            updateScore();
            resetStrikes();
            loadNextQuestion();
        }

        function resetStrikes() {
            document.getElementById('strike-1').classList.remove('active');
            document.getElementById('strike-2').classList.remove('active');
            document.getElementById('strike-3').classList.remove('active');
        }

        function updateScore() {
            document.getElementById('score').innerText = currentScore;
        }

        function loadNextQuestion() {
            if (currentScore >= TARGET_SCORE) {
                document.getElementById('game-area').style.display = 'none';
                document.getElementById('proceed-btn').style.display = 'block';
                return;
            }

            const currentQ = activeQuestions[questionsAsked];
            document.getElementById('question-text').innerText = currentQ[0];
            
            // Extract options and shuffle them
            const options = [
                { text: currentQ[1], correct: true },
                { text: currentQ[2], correct: false },
                { text: currentQ[3], correct: false },
                { text: currentQ[4], correct: false }
            ];
            options.sort(() => 0.5 - Math.random());

            const container = document.getElementById('options-container');
            container.innerHTML = ''; 

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => handleAnswer(btn, opt.correct, currentQ[1]);
                container.appendChild(btn);
            });

            questionsAsked++;
        }

        function handleAnswer(btn, isCorrect, correctString) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            if (isCorrect) {
                btn.classList.add('correct');
                currentScore++;
                updateScore();
                setTimeout(loadNextQuestion, 1000);
            } else {
                btn.classList.add('wrong');
                strikes++;
                document.getElementById(`strike-${strikes}`).classList.add('active');
                
                // Show the correct answer
                allBtns.forEach(b => {
                    if(b.innerText === correctString) b.classList.add('correct');
                });

                if (strikes >= MAX_STRIKES) {
                    setTimeout(() => {
                        alert("SECURITY BREACH DETECTED. 3 FAILED ATTEMPTS. TERMINAL REBOOTING.");
                        initGame(); // Reset the game
                    }, 1200);
                } else {
                    setTimeout(loadNextQuestion, 1500);
                }
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>
